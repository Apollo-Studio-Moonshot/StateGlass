[package]
name = "stateglass"
version = "0.1.0"
description = "Stateglass — a visual debugging IDE"
authors = ["Stateglass"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "stateglass_lib"
crate-type = ["rlib"]

[[bin]]
name = "stateglass-sidecar"
path = "src/bin/stateglass-sidecar.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync", "fs"] }
sysinfo = "0.33"
notify = "8"
similar = "2"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
